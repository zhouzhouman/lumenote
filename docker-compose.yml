# ============================================================
# Lumenote 单机部署编排（PostgreSQL + Redis + 应用 + 一次性迁移）
# ============================================================
#
# ## 启动顺序（迁移必须只执行一次）
#
#   docker compose up -d postgres redis     # 1. 起依赖，等 healthy
#   docker compose run --rm migrate         # 2. 一次性迁移，退出码 0 才继续
#   docker compose --profile app up -d app  # 3. 起应用
#
# 为什么 app 不在启动时执行 `prisma migrate deploy`：
#   - 多副本时每个副本都会执行一遍迁移，把「部署顺序」交给竞速；
#   - 迁移失败会让应用容器进入重启循环（restart: unless-stopped），
#     日志被反复覆盖，真正的原因被埋掉；
#   - 迁移只需要 schema 与 prisma CLI，而 app 镜像刻意不含 CLI（见 Dockerfile）。
#   因此 migrate 是独立的**一次性**服务（restart: "no"），成功后退出。
#   重复执行 `run --rm migrate` 是幂等的（已应用的迁移会被跳过）。
#
# ## 变量来源
#
#   compose 会自动读取本目录的 `.env` 做变量插值（`.env` 已被 .gitignore 忽略）。
#   不要把 `.env.local` 直接喂给容器：它含 NODE_ENV=development，
#   而且里面的 DATABASE_URL 指向宿主机的 localhost，在容器网络内不可达。
#   镜像里**不包含**任何 .env 文件，密钥只通过下面的 environment 注入。
#
# ⚠️ 本机没有安装 Docker，本文件未执行 `docker compose config`，
#    仅用 PyYAML 解析 + 人工核对语义（见 docs/adr/0005-async-execution-boundary.md）。
# ============================================================

services:
  # ---------- PostgreSQL ----------
  # ⚠️ 必须是带 pgvector 的镜像，不能用官方 postgres:16-alpine。
  # 原因：init 迁移的第一行是 `CREATE EXTENSION IF NOT EXISTS vector`
  # （KnowledgeChunk.embedding 是 vector 类型），官方镜像没有这个扩展，
  # `docker compose run --rm migrate` 会直接失败：
  #   SqlState(E0A000) extension "vector" is not available
  # pgvector/pgvector:pg16 = 官方 PG16 + 预编译扩展，其余行为一致。
  #
  # 同时固定 pg16 而不是 latest：latest 会在某次拉取时突然升级大版本，
  # 导致本地能跑、线上挂掉的经典问题。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lumenote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumenote
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-lumenote}'
      # ⚠️ 必须与 .env.example / README 里的库名一致。
      # 这里曾是 lumenote_dev，而 .env.example 的 DATABASE_URL 写的是 lumenote，
      # 于是「先 up postgres 再按 README 连库」直接失败 —— P0 级不一致，已统一为 lumenote。
      POSTGRES_DB: lumenote
      # 固定排序规则，避免不同机器上索引行为不一致
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # 左端口可改（如被占用就设 POSTGRES_PORT=5433），右端口固定，容器内不动
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lumenote-pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 pg_isready 而不是看日志：日志有延迟，会让依赖它的步骤过早开始
      test: ['CMD-SHELL', 'pg_isready -U lumenote -d lumenote']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------- Redis ----------
  redis:
    # 已由 RATE_LIMIT_DRIVER=redis 使用（多实例共享限流状态；单实例仍可用默认的 memory）。
    # 保留独立服务是因为「限流状态放进程内存」在多副本下等于每实例各限一遍，
    # 切到 redis 只需要改环境变量，不需要改代码与编排。
    image: redis:7-alpine
    container_name: lumenote-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 一次性数据库迁移 ----------
  # 用法：docker compose run --rm migrate
  #   - `run` 的容器退出后即删除（--rm），不会常驻、不会被 restart 拉起；
  #   - restart: "no" 是双保险：即使误用 `up migrate`，失败也不会反复重试；
  #   - profile 只是防止 `docker compose up` 顺手跑迁移 ——
  #     显式指定服务名（run/up migrate）时 profile 会被忽略，仍然可用。
  migrate:
    build:
      context: .
      target: migrator
    image: lumenote-migrator:local
    profiles: ['app']
    restart: 'no'
    environment:
      NODE_ENV: production
      # 容器网络内用服务名 postgres，不能用 localhost
      DATABASE_URL: 'postgresql://lumenote:${POSTGRES_PASSWORD:-lumenote}@postgres:5432/lumenote?schema=public'
      DIRECT_URL: 'postgresql://lumenote:${POSTGRES_PASSWORD:-lumenote}@postgres:5432/lumenote?schema=public'
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- 应用 ----------
  # 用法：docker compose --profile app up -d app
  # 前提：已执行过 migrate（顺序见文件顶部）。
  app:
    build:
      context: .
      target: runner
    image: lumenote-app:local
    profiles: ['app']
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      # 运行期固定 production：standalone server 依赖它选择生产行为
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      # 数据库：容器网络内走 postgres 服务名
      DATABASE_URL: 'postgresql://lumenote:${POSTGRES_PASSWORD:-lumenote}@postgres:5432/lumenote?schema=public'
      DIRECT_URL: 'postgresql://lumenote:${POSTGRES_PASSWORD:-lumenote}@postgres:5432/lumenote?schema=public'
      # 密钥只从宿主的 .env / shell 注入，绝不 COPY 进镜像层。
      # 未设置时 compose 直接报错退出（fail fast），避免用默认密钥跑起来更危险。
      AUTH_SECRET: '${AUTH_SECRET:?请在 .env 或 shell 中设置 AUTH_SECRET（openssl rand -base64 32）}'
      # ---- LLM Provider ----
      DEEPSEEK_BASE_URL: '${DEEPSEEK_BASE_URL:-https://api.deepseek.com}'
      DEEPSEEK_API_KEY: '${DEEPSEEK_API_KEY:-}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      # 与 src/lib/llm/registry.ts / pricing.ts / .env.example 的模型 ID 保持一致。
      # （曾误写成 deepseek-v4.1-flash，而代码只认识 deepseek-flash —— 会让计费与
      #   降级链全部落到「未知模型」分支。）
      DEFAULT_MODEL: '${DEFAULT_MODEL:-deepseek-flash}'
      FALLBACK_MODEL: '${FALLBACK_MODEL:-deepseek-v4-pro}'
      # 演示/预览环境可设为 true，强制使用本地 mock，避免真实付费调用
      MOCK_LLM: '${MOCK_LLM:-false}'
      # ---- 限流 ----
      # memory（默认，单实例）| redis（多实例共享，需要下面的 REDIS_URL）
      RATE_LIMIT_DRIVER: '${RATE_LIMIT_DRIVER:-memory}'
      REDIS_URL: 'redis://redis:6379'
      RATE_LIMIT_REDIS_PREFIX: '${RATE_LIMIT_REDIS_PREFIX:-lumenote:rl:}'
      # open：Redis 故障时回退进程内存（可用性优先，退化为每实例限流）
      # closed：Redis 故障时拒绝请求（安全优先，全站 429）
      RATE_LIMIT_FAIL_MODE: '${RATE_LIMIT_FAIL_MODE:-open}'
      # 可信代理层数。0 = 不信任任何 X-Forwarded-For / X-Real-IP（默认，最安全，
      # 但所有请求共享一个 IP 限流桶）；部署在 N 层反向代理之后时按实际层数设置，
      # 且应用端口**只能**对代理开放，否则直连者可伪造 XFF。
      TRUST_PROXY_HOPS: '${TRUST_PROXY_HOPS:-0}'
      RATE_LIMIT_PER_MINUTE: '${RATE_LIMIT_PER_MINUTE:-10}'
      FREE_DAILY_QUOTA: '${FREE_DAILY_QUOTA:-20}'
      MAX_CONCURRENT_TASKS_PER_USER: '${MAX_CONCURRENT_TASKS_PER_USER:-1}'
      # ---- 邮件（注册验证码）----
      # console：不发信，验证码打到日志；生产环境代码硬性禁止把验证码回传客户端。
      # 真发信两条路：公网 resend（需 RESEND_API_KEY + 验证过的发件域名），
      # 或内网 smtp（指向同网段中继，或 SMTP_DIRECT=true 直投 MX）。
      # 是否要求注册时验证邮箱。默认 false：内网常常没有可用邮件通道，
      # 强制验证会把新用户全挡在门外。开启前请确认上面的邮件通道真的能用。
      REQUIRE_EMAIL_VERIFICATION: '${REQUIRE_EMAIL_VERIFICATION:-false}'
      MAIL_TRANSPORT: '${MAIL_TRANSPORT:-console}'
      MAIL_FROM: '${MAIL_FROM:-Lumenote <no-reply@lumenote.local>}'
      RESEND_API_KEY: '${RESEND_API_KEY:-}'
      # ---- 内网 SMTP（MAIL_TRANSPORT=smtp 时生效）----
      # ⚠️ 这里的每一项都要显式透传：compose 不会自动把宿主 .env 里的变量
      # 塞进容器，漏一个就会出现「.env 里配了 SMTP_HOST，容器里却是空的」。
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-}'
      SMTP_SECURE: '${SMTP_SECURE:-}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      SMTP_FROM: '${SMTP_FROM:-}'
      SMTP_REJECT_UNAUTHORIZED: '${SMTP_REJECT_UNAUTHORIZED:-}'
      SMTP_DIRECT: '${SMTP_DIRECT:-}'
      # ---- 应用 ----
      # ⚠️ 局域网部署要改成实际访问地址（如 http://192.168.1.10:3000），
      # Cookie 的 Secure 属性据此推断；写成 localhost 会导致别的主机登录不上
      NEXT_PUBLIC_APP_URL: '${NEXT_PUBLIC_APP_URL:-http://localhost:3000}'
      # 留空 = 按 APP_URL 协议自动推断；内网走 HTTP 时不要设 true
      COOKIE_SECURE: '${COOKIE_SECURE:-}'
      # 仅在需要跨子域共享登录态时设置（如 .example.com）
      COOKIE_DOMAIN: '${COOKIE_DOMAIN:-}'
    healthcheck:
      # 与 Dockerfile 中的 HEALTHCHECK 相同：/api/health 只有在 db.ok 时才 200，
      # 因此这里同时覆盖「进程活着」与「数据库可用」。
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  lumenote-pgdata:

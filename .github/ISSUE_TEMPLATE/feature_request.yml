name: 功能建议
description: 提出一个新功能或改进想法
title: '[feat] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再谈方案。功能建议不保证会被实现，但会认真评估。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下会遇到什么困难？现阶段的替代做法是什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 描述期望的行为与交互；如果涉及 API 或数据模型变更请一并说明。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 文档与编辑器
        - AI Agent / 可追溯性
        - 认证 / 授权
        - 配额与计费
        - 数据导入 / 导出
        - 可观测性 / 评估
        - 构建 / 部署 / CI
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 你考虑过的其他做法，以及为什么没选它们。
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意提交实现
      options:
        - 愿意，我可以提 PR
        - 愿意，但需要指导
        - 暂不打算实现
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与文档，未发现重复建议
          required: true

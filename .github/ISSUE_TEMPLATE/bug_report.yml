name: Bug 报告
description: 报告一个可复现的缺陷（安全问题请勿在此公开）
title: '[bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有相同 issue。

        > **安全提示**：请勿在公开 issue 中粘贴 secret、真实 API Key、用户数据或生产连接串。
        > 如果你发现的是安全漏洞，请私下联系维护者，不要公开利用细节。

  - type: textarea
    id: summary
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为的差异，尽量简短准确。
      placeholder: 预期……，实际……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越稳定越好；涉及 AI 输出时请说明 MOCK_LLM 是否开启。
      placeholder: |
        1. 执行……
        2. 打开……
        3. 观察到……
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 认证 / 授权
        - 文档与编辑器
        - AI Agent / 流式返回
        - 配额与计费
        - 数据导入 / 导出
        - 数据库 / 迁移
        - 构建 / 部署 / CI
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 请贴 `git rev-parse --short HEAD` 的输出。
      placeholder: 例如 7f47926
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      description: 只保留报错堆栈与关键上下文，删除 token、cookie、个人数据。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认内容中不包含真实 secret 或个人数据
          required: true
        - label: 我已搜索过现有 issue，未发现重复
          required: true

version: 2
updates:
  # 运行时依赖：语义化版本内自动合并补丁
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # AI SDK 与 Next 是升级最易破坏项目的两个，单独成组便于一起验证
      ai-and-framework:
        patterns:
          - 'ai'
          - '@ai-sdk/*'
          - 'next'
          - 'react'
          - 'react-dom'
      database:
        patterns:
          - 'prisma'
          - '@prisma/*'
      # 可观测性依赖升级风险低、版本联动强（api 与 sdk-* 需成对升级），单独成组
      observability:
        patterns:
          - '@opentelemetry/*'
          - 'ioredis'
      # 测试工具链：vitest 与 coverage 插件必须版本对齐，否则 peer 依赖会冲突
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # vitest 5 不是一次普通升级：它要求 vite ^6.4 || ^7，会连带把
      # vite 5→7、@vitejs/plugin-react 4→5、@vitest/coverage-v8 2→5 一起拽上去，
      # 还要改 tests/integration/global-setup.ts 的 GlobalSetupContext 签名。
      # 迁移清单见 issue #16；在完成之前屏蔽 major，避免 PR 反复开又反复关。
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  # GitHub Actions 本身也要跟进，供应链风险不可忽视
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
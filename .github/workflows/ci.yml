name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新 push / 新提交会取消上一个未完成的运行，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读：CI 不需要写仓库权限。
# 镜像发布需要 packages: write，放在独立的 docker-publish.yml 里单独提权。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 基础质量门禁：不依赖数据库、不依赖外部网络服务
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # pnpm 版本只以 package.json 的 packageManager 字段为唯一事实来源，
      # 不在 workflow 里手写版本号，也不依赖 runner 预装的 pnpm。
      # 必须在 actions/setup-node 之前完成：setup-node 的 cache: pnpm
      # 需要先执行 `pnpm store path`，pnpm 不在 PATH 上会直接失败。
      - name: 读取 package.json 中的 pnpm 版本
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # 缓存 pnpm store 而不是 node_modules：
      # node_modules 里有平台相关的二进制，跨平台缓存不可靠；
      # store 是内容寻址的，可安全跨平台复用。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 数据库不需要真实实例：单测是纯逻辑，不连库。
      # 提前给一份合法假值，避免因缺环境变量而整批失败。
      - name: 准备环境变量
        run: |
          echo "AUTH_SECRET=ci-secret-at-least-32-characters-long-xxxx" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://u:p@localhost:5432/test" >> "$GITHUB_ENV"
          echo "MOCK_LLM=true" >> "$GITHUB_ENV"
          echo "DEFAULT_MODEL=deepseek-flash" >> "$GITHUB_ENV"

      - name: Prisma schema 校验
        run: pnpm prisma validate

      - name: Prisma client 生成
        run: pnpm prisma:generate

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      # standalone 产物由 Docker 镜像构建负责，这里只验证普通生产构建可成功。
      - name: 构建
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # ---------------------------------------------------------------------------
  # 集成测试：真正连 Postgres + 真实 HTTP。
  #
  # 环境准备全部由 vitest.integration.config.ts 的 globalSetup 负责：
  #   1) DROP SCHEMA public CASCADE; CREATE SCHEMA public;
  #   2) prisma migrate deploy
  #   3) tsx prisma/seed.ts
  #   4) 启动被测应用（next dev，**不需要先 build**）
  #   5) 轮询 /api/health 就绪
  #
  # 因此这里只需要：Postgres service 可达 + Prisma client 已生成。
  # 不要再加 `prisma deploy` / `prisma seed` 步骤 —— 与 harness 的「重置库」
  # 顺序冲突，且会白跑一遍迁移/种子，掩盖 harness 自己的失败。
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # ⚠️ 不能用官方 postgres:16-alpine：init 迁移第一行是
        # `CREATE EXTENSION IF NOT EXISTS vector`（KnowledgeChunk.embedding 是 vector 类型），
        # 而官方镜像**不含 pgvector**，迁移会以
        #   SqlState(E0A000) extension "vector" is not available
        # 失败 —— 表现为「集成测试 2 秒就挂」，很容易被误判成测试代码的问题。
        # pgvector/pgvector:pg16 就是官方 PG16 + 预编译好的 vector 扩展，其余行为一致。
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumenote
          POSTGRES_PASSWORD: lumenote
          POSTGRES_DB: lumenote_test
        ports:
          - 5432:5432
        # 等数据库真正可接受连接，而不是容器启动即开跑
        options: >-
          --health-cmd "pg_isready -U lumenote -d lumenote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTH_SECRET: ci-secret-at-least-32-characters-long-xxxx
      DATABASE_URL: postgresql://lumenote:lumenote@localhost:5432/lumenote_test?schema=public
      MOCK_LLM: 'true'
      DEFAULT_MODEL: deepseek-flash

    steps:
      - uses: actions/checkout@v7

      - name: 读取 package.json 中的 pnpm 版本
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # harness 会自行 migrate + seed；但 next dev 启动的应用 import @prisma/client，
      # 测试进程内的 globalSetup 也直接 import @prisma/client，所以 client 必须先生成。
      - name: Prisma client 生成
        run: pnpm prisma:generate

      - name: 集成测试（harness 自管 schema / migrate / seed / next dev）
        # 失败时把日志尾部写进 Job Summary + 一条 error 注解。
        # Actions 日志需要登录才能看，而 Summary 与注解在公开仓库上可读 ——
        # 集成测试的失败原因几乎总在「migrate / seed / next dev 启动」这段
        # 子进程输出里，看不到就等于不可诊断。
        run: |
          set +e
          set -o pipefail
          pnpm test:integration 2>&1 | tee integration.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### 集成测试失败（退出码 $code）"
              echo ""
              echo '```text'
              tail -c 12000 integration.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 注解只放最后 25 行：够定位，又不会把 Checks 页面刷爆
            detail=$(tail -25 integration.log | sed 's/%/%25/g' | tr '\n' '|' | cut -c1-6000)
            echo "::error title=集成测试失败::${detail}"
          fi
          exit $code

      - name: 上传集成测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Redis 限流真实验证：本机/大多数开发环境没有 Redis，
  # 唯一能证明 Lua 脚本、并发原子计数、TTL/窗口恢复在真 Redis 上成立的地方就是 CI。
  #
  # 脚本语义（scripts/verify/rate-limit-redis.mjs）：
  #   0 = 全部检查通过（真实 Redis 已验证）
  #   1 = 验证失败
  #   2 = Redis 不可用，SKIPPED（脚本「绝不伪装成功」）
  # 本 job 的 Redis 来自 service，正常应退出 0；若退出 2 说明 service 没起来，
  # job 同样变红 —— 不把「跳过」当「通过」。
  #
  # ⚠️ 本地无 Docker/Redis：本 job 未在本地实际运行，仅做静态校验（actionlint）。
  # ---------------------------------------------------------------------------
  rate-limit-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # 等 Redis 真正可响应，而不是容器启动即开跑
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_REDIS_PREFIX: 'lumenote:rl:'

    steps:
      - uses: actions/checkout@v7

      - name: 读取 package.json 中的 pnpm 版本
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Prisma client 生成
        run: pnpm prisma:generate

      - name: 真实 Redis 限流验证
        run: pnpm test:redis

  # ---------------------------------------------------------------------------
  # 覆盖率：上传 coverage/ 供人工与阈值门禁使用。
  # 阈值由 vitest.config.ts 的 coverage.thresholds 实现：未达标时 vitest 以
  # 非 0 退出 → 本 job 失败；报告仍会通过 if: always() 上传便于定位。
  # 覆盖率只统计单测（集成测试被 vitest.config.ts 显式排除）。
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: 读取 package.json 中的 pnpm 版本
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 测试会 import @prisma/client，未生成时类型/运行时都会失败
      - name: Prisma client 生成
        run: pnpm prisma:generate

      - name: 覆盖率测试
        run: pnpm test:coverage
        env:
          AUTH_SECRET: ci-secret-at-least-32-characters-long-xxxx
          DATABASE_URL: postgresql://u:p@localhost:5432/test
          MOCK_LLM: 'true'
          DEFAULT_MODEL: deepseek-flash

      # 即使覆盖率测试失败也要留下报告，便于定位
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # PR 侧供应链检查：只读权限、不需要任何预配置 secret。
  # 只在 pull_request 事件运行（push 到 main 时没有 base/head diff 可比）。
  # ---------------------------------------------------------------------------
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7

      - name: 依赖变更审查（漏洞 / license / 新增依赖）
        uses: actions/dependency-review-action@v4
        with:
          # 高危及以上直接阻断；低危只提示不阻断
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # secret 扫描：直接用官方 gitleaks CLI，而不是 gitleaks-action。
  # 原因：gitleaks-action 在 organization 仓库需要 GITLEAKS_LICENSE，
  # 未配置时会让 CI 变红；CLI 对公开/个人/组织仓库行为一致，
  # 且不需要任何预先配置的 secret。扫描当前工作树（含未跟踪的工作区），
  # 不扫全量 git 历史 —— 见 CONTRIBUTING.md 的说明与局限。
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: 下载固定版本的 gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 扫描工作树中的疑似凭据
        # 失败时把命中项写进 Job Summary：日志需要登录才能看，而 Summary 在
        # 公开仓库上是可读的，排查「CI 红了但本地复现不出来」时这一点很关键。
        # 报告本身用 --redact 生成，Summary 里不会出现完整凭据。
        run: |
          set +e
          gitleaks dir . --config .github/gitleaks.toml --redact --verbose --exit-code 1 \
            --report-format json --report-path gitleaks-report.json
          code=$?
          if [ -f gitleaks-report.json ]; then
            {
              echo "### gitleaks 命中 $(jq 'length' gitleaks-report.json 2>/dev/null || echo '?') 条"
              echo ""
              echo "| 规则 | 文件 | 行 | 片段（已脱敏） |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | `\((.Match // "")[0:60])` |"' gitleaks-report.json 2>/dev/null | head -50
            } >> "$GITHUB_STEP_SUMMARY"
            # 注解里只放「规则@文件:行」，不放片段：注解比 Summary 更容易被转发出去
            detail=$(jq -r '.[:20][] | "\(.RuleID)@\(.File):\(.StartLine)"' gitleaks-report.json 2>/dev/null | tr '\n' '|')
            [ -n "$detail" ] && echo "::error title=gitleaks 命中::${detail}"
          fi
          exit $code

      - name: 上传 gitleaks 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
